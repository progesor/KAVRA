name: KAVRA source-only preflight

on:
  push:
    branches: ["feat/**"]
  pull_request:
  workflow_dispatch:

jobs:
  source-structure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Validate source contracts (not Unity compilation)
        run: python3 scripts/validate_bootstrap.py
      - name: Parse Windows Unity acceptance runner (no Unity execution)
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "scripts/Run-KavraUnityEditMode.ps1",
            [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.ToString() }
            exit 1
          }
          Write-Host "PASS: PowerShell runner source parses."
